name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - run: make coverage

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: python3 -m unittest discover -s workflows/herdr-activity-summary -p 'test_*.py'
